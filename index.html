<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dream Closet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff4d8d;--lil:#9b5de5;--ink:#3b2346;--soft:#fff0f6;--line:#f1d6e4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:#fde7f1;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font-family:inherit;cursor:pointer;color:inherit}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:linear-gradient(#fff5fa,#f6edfd);position:relative;overflow:hidden}
header{display:flex;align-items:center;gap:8px;padding:8px 10px;background:linear-gradient(90deg,#ff4d8d,#9b5de5);color:#fff;flex:0 0 auto}
#dname{flex:1;min-width:0;font-family:Fredoka,sans-serif;font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:none;border:0;color:#fff;text-align:left;padding:0}
.lvl{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:11px;font-weight:900}
.xpbar{width:64px;height:6px;background:#ffffff55;border-radius:4px;overflow:hidden}.xpbar i{display:block;height:100%;background:#fff;width:0;transition:width .4s}
.coins{background:#ffffff33;border-radius:20px;padding:4px 10px;font-weight:900;font-size:14px;white-space:nowrap}
.hbtn{background:#ffffff33;border:0;color:#fff;border-radius:50%;width:32px;height:32px;font-size:15px;flex:0 0 auto}
main{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch}
.screen.on{display:block}
#scr-style.on{display:flex;flex-direction:column;overflow:hidden}
#banner{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 10px;background:#fff3b0;font-size:13px;font-weight:900;flex:0 0 auto}
#banner[hidden]{display:none}
#banner .tip{font-size:11px;font-weight:700;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x2{border:0;background:#0000000d;border-radius:50%;width:28px;height:28px;font-size:13px}
#stage{flex:1;min-height:0;position:relative}
#doll,#stagebg{position:absolute;inset:0}#stagebg svg{width:100%;height:100%;display:block}
#doll svg{width:100%;height:100%;display:block}
.sbtns{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.sbtns button{width:38px;height:38px;border-radius:50%;border:0;background:#ffffffe6;box-shadow:0 2px 6px #0002;font-size:17px;padding:0}
#panel{flex:0 0 47%;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -4px 16px #9b5de525;display:flex;flex-direction:column;min-height:0}
.hs{display:flex;gap:6px;overflow-x:auto;padding:8px 8px 4px;scrollbar-width:none;flex:0 0 auto;align-items:center}.hs::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;border:0;background:var(--soft);border-radius:14px;padding:4px 8px;font-size:11px;font-weight:900;display:flex;flex-direction:column;align-items:center;min-width:58px}
.cat b{font-size:20px;line-height:1.15}
.cat.on{background:linear-gradient(135deg,#ff4d8d,#9b5de5);color:#fff}
#subs{padding-top:2px}
.sub{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:900}
.sub.on{border-color:var(--pink);color:var(--pink);background:#fff0f6}
#grid{flex:1;min-height:0;overflow-y:auto;padding:4px 8px 8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:7px;align-content:start;align-items:start}
.it{position:relative;width:100%;height:auto;aspect-ratio:1/1;border-radius:14px;background:#fbf4fb;border:2px solid transparent;padding:2px}
.it svg{width:100%;height:100%;display:block}
.it.on{border-color:var(--pink);background:#fff0f6}
.it .lk{position:absolute;left:0;right:0;bottom:0;border-radius:0 0 12px 12px;background:#3b2346d0;color:#fff;font-size:9.5px;font-weight:900;font-style:normal;text-align:center;padding:2px 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .lk.nm{background:#ffffffd0;color:var(--ink)}
.it.locked svg{opacity:.5;filter:saturate(.6)}
.it.none span{font-size:26px;display:flex;height:100%;align-items:center;justify-content:center;opacity:.6}
.it.skin span{display:block;width:70%;height:70%;margin:15%;border-radius:50%;box-shadow:inset 0 -4px 0 #0001,0 1px 3px #0002}
#cbar{flex:0 0 auto;border-top:1px solid var(--line);padding:6px 0 6px}
.ctabs{display:flex;gap:6px;align-items:center;padding:0 8px;min-height:24px}
.ctab{border:0;background:var(--soft);border-radius:12px;padding:3px 10px;font-weight:900;font-size:12px}.ctab.on{background:var(--ink);color:#fff}
.iname{margin-left:auto;font-weight:800;font-size:12px;opacity:.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:45%}
.row{padding:6px 8px 2px}
.sw{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px #0002;position:relative;padding:0}
.sw.on{box-shadow:0 0 0 3px var(--pink)}
.sw.lock::after{content:'🔒';position:absolute;inset:-2px;font-size:11px;display:flex;align-items:center;justify-content:center;background:#ffffffaa;border-radius:50%}
.sep{flex:0 0 6px}
.pt{flex:0 0 auto;border-radius:10px;border:2px solid #0001;padding:0;width:52px;height:44px;overflow:hidden;position:relative;background:#fff}
.pt svg{width:100%;height:28px;display:block}.pt i{display:block;font-size:9px;font-style:normal;font-weight:900}
.pt.on{border-color:var(--pink)}.pt.lock svg{opacity:.35}.pt.lock::after{content:'🔒';position:absolute;top:4px;left:0;right:0;font-size:12px}
.hint{font-size:12px;opacity:.7;font-weight:700;margin:4px 0}
nav{display:flex;flex:0 0 auto;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:6px 0 7px;font-size:11px;font-weight:900;color:#a58fb5;display:flex;flex-direction:column;align-items:center;gap:1px}
nav button b{font-size:21px;filter:grayscale(.7);opacity:.8}nav button.on{color:var(--pink)}nav button.on b{filter:none;opacity:1}
.wrap{padding:12px 12px 24px}
h2{font-family:Fredoka,sans-serif;margin:4px 0 8px;font-size:23px;font-weight:600}
h3{font-family:Fredoka,sans-serif;margin:2px 30px 10px 0;font-size:20px;font-weight:600}
.card{background:#fff;border-radius:18px;padding:12px;box-shadow:0 3px 12px #9b5de51a;margin-bottom:12px}
.card.daily{display:flex;gap:10px;align-items:center;background:linear-gradient(135deg,#fff,#fff0f6)}
.card.daily .ic{font-size:34px}
.btn{border:0;border-radius:14px;padding:10px 16px;font-weight:900;font-size:14px;background:linear-gradient(135deg,#ff4d8d,#9b5de5);color:#fff;box-shadow:0 3px 8px #ff4d8d33}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:11px}
.btn.alt{background:var(--soft);color:var(--ink);box-shadow:none}
.btn.gold{background:linear-gradient(135deg,#ffb703,#ff4d8d)}
.btn.danger{background:#e63946;color:#fff}
.btn:disabled{opacity:.45;box-shadow:none}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.row2.tight{margin-top:4px;justify-content:center}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.theme{background:#fff;border-radius:16px;padding:10px;box-shadow:0 2px 8px #9b5de51a;text-align:left;border:0}
.theme .ic{font-size:30px}.theme .tn{font-weight:900;font-size:14px}.theme .st{color:#ffb703;font-size:14px;letter-spacing:1px;font-weight:900}
.theme .rw{font-size:10.5px;font-weight:800;opacity:.65;margin-top:3px}
.theme .st .e{color:#eadcef}.theme.locked{opacity:.5}.theme.locked .st{color:var(--ink)}
#modal{position:absolute;inset:0;background:#2a1838b0;display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
#modal[hidden]{display:none}
.mbox{background:#fff;border-radius:22px;padding:16px;width:100%;max-width:420px;max-height:92%;overflow-y:auto;position:relative;animation:pop .2s ease-out}
.mbox.tall{max-height:96%}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.x{position:absolute;right:8px;top:6px;border:0;background:none;font-size:26px;line-height:1;opacity:.6;z-index:2}
#toasts{position:absolute;top:56px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:60}
.toast{background:#3b2346f0;color:#fff;padding:8px 14px;border-radius:14px;font-weight:800;font-size:13px;box-shadow:0 4px 12px #0003;animation:tin .25s ease-out;max-width:92%;text-align:center}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
.tx{width:100%;padding:10px 12px;border-radius:12px;border:2px solid var(--line);font-size:16px;font-family:inherit;margin-top:8px;-webkit-user-select:text;user-select:text}
textarea.tx{height:110px;font-size:11px;word-break:break-all}
.bar{height:8px;background:#f1d6e4;border-radius:5px;overflow:hidden}.bar.thin{height:5px;margin:4px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff4d8d,#9b5de5)}
.ach{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #f6e6ef}.ach:last-child{border:0}
.ach .ai{font-size:26px;width:36px;text-align:center;flex:0 0 auto}.ach:not(.done) .ai{filter:grayscale(1);opacity:.55}
.ach b{font-size:14px}.rwd{font-size:11px;font-weight:800;color:#9b5de5;margin-top:2px}
.statrow{display:flex;justify-content:space-around;text-align:center}.statrow div{display:flex;flex-direction:column}.statrow b{font-family:Fredoka,sans-serif;font-size:20px}.statrow span{font-size:11px;opacity:.6;font-weight:800}
.statrow.small{margin-top:10px}.statrow.small b{font-size:16px}
.prev{width:150px;height:150px;margin:0 auto;background:#fbf4fb;border-radius:18px}.prev svg{width:100%;height:100%}
.price{font-size:22px;font-weight:900;text-align:center;margin:10px 0 0}
.tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-top:8px}.tags span{background:var(--soft);border-radius:8px;padding:2px 7px;font-size:11px;font-weight:800}
.mbox p{margin:8px 0}
.big{height:74vh}.big svg{width:100%;height:100%}
.shot{width:100%;border-radius:14px;display:block;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.jdoll{height:200px;float:left;width:110px;margin-right:8px}.jdoll svg{width:100%;height:100%}
.judges{min-height:200px}
.judge{display:flex;gap:8px;align-items:flex-start;margin-bottom:10px;opacity:0;animation:jin .4s ease-out forwards}
.judge .ji{font-size:26px}.jsc{background:#ffd166;border-radius:8px;padding:1px 6px;font-weight:900;font-size:12px}
@keyframes jin{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
.result{clear:both;opacity:0;animation:jin .5s ease-out forwards;text-align:center}
.stars{font-size:38px;color:#ffb703;letter-spacing:4px}
.place{font-family:Fredoka,sans-serif;font-size:20px}
.board{background:var(--soft);border-radius:12px;padding:6px 10px;margin:8px 0;font-size:13px;font-weight:800;text-align:left}.board div{display:flex;justify-content:space-between;padding:2px 0}.board .me{color:var(--pink)}
.reward{font-weight:900}
.result .row2{justify-content:center}
.dolls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dcard{background:#fff;border-radius:16px;border:2px solid transparent;padding:4px;text-align:center;font-weight:900;font-size:12px;box-shadow:0 2px 8px #9b5de51a}
.dcard.on{border-color:var(--pink)}.dcard svg{width:100%;height:110px;display:block}
.dcard.add span{display:flex;height:110px;align-items:center;justify-content:center;font-size:40px;color:var(--pink)}
.dcard.look svg{height:150px}
.presets .dcard svg{height:90px}
.deals{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.deal{text-align:center}.dth{aspect-ratio:1;background:#fbf4fb;border-radius:12px}.dth svg{width:100%;height:100%}.dn{font-size:10.5px;font-weight:800;margin:3px 0;height:26px;overflow:hidden}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-weight:800}
.help{padding-left:18px;font-size:13px;font-weight:700}.help li{margin-bottom:8px}
.welcome{text-align:center}.logo{font-family:Fredoka,sans-serif;font-size:28px;font-weight:700;background:linear-gradient(90deg,#ff4d8d,#9b5de5);-webkit-background-clip:text;background-clip:text;color:transparent}
.welcome p{font-weight:700;font-size:14px}
.boxopen{text-align:center}.gift{font-size:70px;animation:shake .6s ease-in-out 2,gone .2s 1.2s forwards}.reveal{opacity:0;animation:jin .4s 1.3s ease-out forwards}
@keyframes shake{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}@keyframes gone{to{font-size:0;opacity:0}}
.rare{background:linear-gradient(90deg,#ffb703,#ff4d8d);color:#fff;font-size:11px;border-radius:8px;padding:2px 6px;vertical-align:middle}
.conf{position:absolute;inset:0;pointer-events:none;z-index:70;overflow:hidden}.conf span{position:absolute;top:-10px;width:8px;height:12px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
</style>
</head>
<body>
<div id="app">
 <header><button id="dname" data-a="rename"></button><div class="lvl"><span id="lvlNum">Lv 1</span><div class="xpbar"><i id="xpfill"></i></div></div><div class="coins">🪙 <span id="coins">0</span></div><button class="hbtn" data-a="settings" aria-label="Settings">⚙️</button></header>
 <main>
  <section id="scr-style" class="screen on">
   <div id="banner" hidden></div>
   <div id="stage"><div id="stagebg"></div><div id="doll"></div><div class="sbtns"><button data-a="rand" aria-label="Surprise me">🎲</button><button data-a="undo" aria-label="Undo">↩️</button><button data-a="look" aria-label="Save look">💾</button><button data-a="photo" aria-label="Photo">📸</button><button data-a="view" aria-label="Full view">🔍</button></div></div>
   <div id="panel"><div id="cats" class="hs"></div><div id="subs" class="hs"></div><div id="grid"></div><div id="cbar"></div></div>
  </section>
  <section id="scr-contest" class="screen"></section>
  <section id="scr-shop" class="screen"></section>
  <section id="scr-dolls" class="screen"></section>
  <section id="scr-trophies" class="screen"></section>
 </main>
 <nav><button data-a="nav" data-s="style" class="on"><b>👗</b>Style</button><button data-a="nav" data-s="contest"><b>🏆</b>Contests</button><button data-a="nav" data-s="shop"><b>🛍️</b>Shop</button><button data-a="nav" data-s="dolls"><b>👯</b>Dolls</button><button data-a="nav" data-s="trophies"><b>🎖️</b>Trophies</button></nav>
 <div id="modal" hidden></div>
 <div id="toasts"></div>
</div>
<script>
'use strict';
/* ---------- drawing helpers ---------- */
const OLs='#00000030';
const OL='stroke="#00000030" stroke-width="1.4" stroke-linejoin="round"';
function shade(h,a){if(typeof h!=='string'||h[0]!=='#')return h;let c=h.slice(1);if(c.length===3)c=[...c].map(z=>z+z).join('');c=c.slice(0,6);const n=parseInt(c,16);const f=v=>Math.max(0,Math.min(255,Math.round(a<0?v*(1+a):v+(255-v)*a)));return '#'+[n>>16&255,n>>8&255,n&255].map(v=>f(v).toString(16).padStart(2,'0')).join('');}
function lum(h){if(!h||h[0]!=='#')return .5;const n=parseInt(h.slice(1,7),16);return((n>>16&255)*.299+(n>>8&255)*.587+(n&255)*.114)/255;}
const P=(d,f,e='')=>`<path d="${d}" fill="${f}" ${e}/>`;
const PO=(d,f)=>P(d,f,OL);
const S_=(d,c,w,e='')=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${e}/>`;
const C=(x,y,r,f,e='')=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" ${e}/>`;
const CO=(x,y,r,f)=>C(x,y,r,f,OL);
const E=(x,y,rx,ry,f,e='')=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${f}" ${e}/>`;
const EO=(x,y,rx,ry,f)=>E(x,y,rx,ry,f,OL);
const R_=(x,y,w,h,f,rx=0,e='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${f}" ${e}/>`;
const mir=s=>`<g transform="matrix(-1 0 0 1 300 0)">${s}</g>`;
const both=s=>s+mir(s);
const rot=(a,x,y,s)=>`<g transform="rotate(${a} ${x} ${y})">${s}</g>`;
function star5(cx,cy,r,ri){ri=ri||r*.45;const p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?ri:r;p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1));}return 'M'+p.join('L')+'Z';}
const spark=(x,y,r)=>`M${x},${y-r}Q${x},${y} ${x+r},${y}Q${x},${y} ${x},${y+r}Q${x},${y} ${x-r},${y}Q${x},${y} ${x},${y-r}Z`;
const heart=(x,y,s)=>`M${x},${y+s*.9}C${x-s*1.6},${y-s*.1} ${x-s*.8},${y-s*1.3} ${x},${y-s*.45}C${x+s*.8},${y-s*1.3} ${x+s*1.6},${y-s*.1} ${x},${y+s*.9}Z`;
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function bezPt(Q,t){const u=1-t;return[0,1].map(i=>u*u*Q[0][i]+2*u*t*Q[1][i]+t*t*Q[2][i]);}
function alongQ(Q,n,fn){let s='';for(let i=0;i<=n;i++){const p=bezPt(Q,i/n);s+=fn(+p[0].toFixed(1),+p[1].toFixed(1),i);}return s;}

/* ---------- body geometry ---------- */
const ARM=[[118,214],[101,268],[98,326]],LEG=[[136,334],[134,428],[133,510]];
const mx=Q=>Q.map(([a,b])=>[300-a,b]);
function seg(Q,t0,t1){const b=(u,v)=>[0,1].map(i=>((1-u)*(1-v)*Q[0][i]+((1-u)*v+u*(1-v))*Q[1][i]+u*v*Q[2][i]).toFixed(1)).join(',');return `M${b(t0,t0)}Q${b(t0,t1)} ${b(t1,t1)}`;}
function limb(Q,col,w,t0=0,t1=1,cap='round',ol=true){const d=seg(Q,t0,t1);return(ol?`<path d="${d}" fill="none" stroke="${OLs}" stroke-width="${w+2.6}" stroke-linecap="${cap}"/>`:'')+`<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="${cap}"/>`;}
const limbs=(Q,...a)=>limb(Q,...a)+limb(mx(Q),...a);
const TORSO='M114,210 Q150,201 186,210 L183,258 Q177,288 175,300 Q183,322 184,348 L116,348 Q117,322 125,300 Q123,288 117,258 Z';
const HIP='M124,294 L176,294 Q184,320 186,352 L114,352 Q116,320 124,294 Z';
const FACE='M94,116 Q94,58 150,58 Q206,58 206,116 Q206,166 172,181 Q150,191 128,181 Q94,166 94,116 Z';
const skirtD=(hem,fl,top=294)=>{const m=(top+hem)/2;return `M124,${top} L176,${top} Q${188+fl*.5},${m} ${184+fl},${hem} Q150,${hem+8} ${116-fl},${hem} Q${112-fl*.5},${m} 124,${top} Z`;};
function scallopD(hem,fl,top=294){const L=116-fl,Rr=184+fl,n=8;let d=`M124,${top} L176,${top} Q${188+fl*.5},${(top+hem)/2} ${Rr},${hem}`;for(let i=1;i<=n;i++){const x0=Rr-(Rr-L)*(i-1)/n,x1=Rr-(Rr-L)*i/n;d+=` Q${((x0+x1)/2).toFixed(1)},${hem+11} ${x1.toFixed(1)},${hem}`;}return d+` Q${112-fl*.5},${(top+hem)/2} 124,${top} Z`;}
function zigD(hem,fl,top=294){const L=116-fl,Rr=184+fl,n=14;let d=`M124,${top} L176,${top} Q${188+fl*.5},${(top+hem)/2} ${Rr},${hem}`;for(let i=1;i<=n;i++){const xx=Rr-(Rr-L)*i/n;d+=` L${xx.toFixed(1)},${i%2?hem-24:hem}`;}return d+` Q${112-fl*.5},${(top+hem)/2} 124,${top} Z`;}
const BUILDS=[{n:'Petite',k:.92},{n:'Classic',k:1},{n:'Curvy',k:1.1},{n:'Strong',k:1.17}];

/* ---------- patterns ---------- */
const RANGE={hair:[40,320],top:[200,310],bottom:[294,516],dress:[200,520],outer:[200,470],shoes:[500,540],legwear:[330,530],hat:[-30,100],bg:[-30,560],back:[150,520],pet:[440,545],held:[140,380],necklace:[190,280]};

 for(const k of SLOTS){const s=sl[k];if(!s)continue;const it=ITEM[s.id];if(!it)continue;if(sl.dress&&ITEM[sl.dress.id]&&(k==='top'||k==='bottom'))continue;if(o.only&&!o.only.includes(k))continue;if(o.skip&&o.skip.includes(k))continue;act[k]={it,s};}

const SCORE_SLOTS=['hair','top','bottom','dress','outer','shoes','legwear','hat','glasses','earrings','necklace','held','back','pet','bg','eyes','mouth','shadow','blush','decal'];
function scoreLook(d,th){const sl=d.slots;let pts=0,hits=0,tot=0,acc=0;const good=[],bad=[];
 for(const k of SCORE_SLOTS){const s=sl[k];if(!s)continue;if(sl.dress&&(k==='top'||k==='bottom'))continue;const it=ITEM[s.id];if(!it)continue;let b=0;for(const t of it.tags)b=Math.max(b,th.tags[t]||0);const w=['eyes','mouth','shadow','blush','decal'].includes(k)?.5:1;const av=(th.avoid||[]).some(t=>it.tags.includes(t));if(av&&b<2){pts-=2;bad.push(it.name);}else{pts+=b*w;if(b>=2&&w===1)good.push(it.name);}if(['earrings','necklace','glasses','hat','held','back'].includes(k))acc++;if(!it.nocolor&&!['bg','eyes','mouth','blush','shadow','decal','pet'].includes(k)){tot++;if(th.cols.includes(famOf(s.c||it.c)))hits++;}}
 const hasTop=!!(sl.dress||sl.top),hasBot=!!(sl.dress||sl.bottom),shoes=!!sl.shoes;let sc=Math.min(1,pts/16)*62+(tot?hits/tot:0)*20+(hasTop&&hasBot?8:0)+(shoes?5:0)+Math.min(acc,2)*2.5;if(!hasTop)sc=Math.min(sc,18);sc=Math.max(3,Math.min(100,Math.round(sc)));return{sc,good,bad,hits,tot,hasTop,hasBot,shoes,acc,pts};}
const starsOf=sc=>sc>=86?5:sc>=72?4:sc>=55?3:sc>=36?2:1;
const RIVALS=['Bella','Luna','Ivy','Coco','Ruby','Nova','Skye','Jade','Mila','Rosa','Tia','Gigi'];
const JUDGES=[['Madame Velour','👩‍🎨'],['DJ Glitter','🎧'],['Coco Couture','💅']];
function judgeLines(r,th){const L=[];const topTag=Object.entries(th.tags).sort((a,b)=>b[1]-a[1])[0][0];
 if(!r.hasTop)L.push('Um... where are the clothes?! 😳');
 if(r.good.length)L.push(`Obsessed with the ${r.good[0]}!`);
 if(r.bad.length)L.push(`The ${r.bad[0]} doesn't fit ${th.n} at all.`);
 if(r.hasTop&&!r.shoes)L.push('Shoes would finish this look.');
 if(r.tot&&r.hits/r.tot>.7)L.push('These colours are perfect for the theme!');else if(r.tot)L.push(`Try more ${th.cols.slice(0,2).join(' or ')} tones.`);
 if(r.pts<10)L.push(`Needs more ${topTag} vibes!`);
 if(r.acc<2)L.push('A few accessories would really pop.');
 if(r.sc>=86)L.push('Iconic. Absolutely iconic. 👑');else if(r.sc>=72)L.push('So close to perfection!');
 while(L.length<3)L.push(pickR(['Love the confidence!','Cute energy!','Bold choices, I like it.']));return L;}
function submitContest(){const th=THEMES.find(t=>t.id===ui.contest);if(!th)return;const d=cur(),r=scoreLook(d,th),stars=starsOf(r.sc),L=level();
 const rivals=RIVALS.slice().sort(()=>Math.random()-.5).slice(0,4).map(n=>({n,sc:Math.round(Math.min(97,42+Math.random()*36+Math.min(L,20)*.7))}));const place=1+rivals.filter(x=>x.sc>r.sc).length;
 const dbl=isDaily(th.id)?2:1;const prev=S.themeBest[th.id]||0;let coins=([0,10,20,35,55,85][stars]+[0,45,25,12,0,0][place])*dbl;if(stars===5&&prev<5)coins+=100;S.lastSubs=S.lastSubs||{};const sig=JSON.stringify(d.slots);const rep=S.lastSubs[th.id]===sig;S.lastSubs[th.id]=sig;let xpG=stars*12+10;if(rep){coins=Math.round(coins*.25);xpG=Math.round(xpG/2);}
 S.stats.contests++;if(stars===5)S.stats.five++;if(place===1)S.stats.wins++;S.themeBest[th.id]=Math.max(prev,stars);
 const lines=judgeLines(r,th).sort(()=>Math.random()-.5);const js=JUDGES.map((j,i)=>({j,s:Math.max(1,Math.min(10,Math.round(r.sc/10+(Math.random()*1.6-.8)))),l:lines[i]}));
 const board=[...rivals,{n:d.name,sc:r.sc,me:1}].sort((a,b)=>b.sc-a.sc);
 const m=modal(`<h3>${th.ic} ${esc(th.n)}</h3><div class="jdoll">${renderDoll(d,{vb:'0 -30 300 590'})}</div><div class="judges">${js.map((x,i)=>`<div class="judge" style="animation-delay:${.3+i*.55}s"><span class="ji">${x.j[1]}</span><div><b>${x.j[0]}</b> <span class="jsc">${x.s}/10</span><div class="hint">“${esc(x.l)}”</div></div></div>`).join('')}</div>
 <div class="result" style="animation-delay:2s"><div class="stars">${'★'.repeat(stars)}<span style="color:#e5d3e8">${'★'.repeat(5-stars)}</span></div><div class="place">${['','🥇 1st place!','🥈 2nd place','🥉 3rd place','4th place','5th place'][place]}</div><div class="board">${board.map((b,i)=>`<div class="${b.me?'me':''}"><span>${i+1}. ${esc(b.n)}</span><span>${b.sc}</span></div>`).join('')}</div><p class="reward">+${coins} 🪙 · +${xpG} XP${dbl>1?' · 2× daily bonus':''}</p>${rep?'<p class="hint">The judges have seen this exact look already, so the prize is smaller. Change something up!</p>':''}<div class="row2"><button class="btn" data-a="again">Try again</button><button class="btn alt" data-a="doneC">Done</button></div></div>`,'tall');
 setTimeout(()=>{sfx('star');if(stars>=4)confetti();},2000);addCoins(coins);addXP(xpG);save();checkAch();}

 again:()=>{closeModal();},
 doneC:()=>{closeModal();ui.contest=null;go('contest');},
 startC:b=>startContest(b.id,b.lv&&+b.lv),
 daily:claimDaily,
 box:b=>openBox(+b.k),
 deal:b=>{const it=ITEM[b.id];buy(b.id,dealPrice(it));renderShop();},
 wearNew:b=>{closeModal();const it=ITEM[b.id];const c=CATS.find(c=>c.subs.includes(it.slot));ui.cat=c.k;ui.sub=it.slot;go('style');equip(b.id);},
 slot:()=>{const c=SLOTCOST[S.maxDolls];if(S.coins<c)return;S.coins-=c;S.maxDolls++;sfx('buy');toast('👯 New doll slot unlocked!');hdr();save();renderShop();},
 pickDoll:b=>{S.cur=+b.i;ui.undo=[];thumbCache.clear();hdr();save();renderDolls();toast(`Now styling ${cur().name}`);},
 newDoll:()=>{pendingPreset=0;newDollModal();},
 preset:(b,el)=>{pendingPreset=+b.i;el.parentNode.querySelectorAll('.dcard').forEach(e=>e.classList.toggle('on',e===el));const n=$('#nm');if(n)n.value=PRESETS[pendingPreset].name;},
 createDoll:()=>{if(S.dolls.length>=S.maxDolls)return;const n=($('#nm').value||'').trim()||PRESETS[pendingPreset].name;S.dolls.push(newDoll(PRESETS[pendingPreset],n));S.cur=S.dolls.length-1;ui.undo=[];thumbCache.clear();if(n!==PRESETS[pendingPreset].name)S.stats.renames++;closeModal();save();checkAch();hdr();renderDolls();toast(`Say hi to ${n}! 💖`);},
 startGame:()=>{const n=($('#nm').value||'').trim()||PRESETS[pendingPreset].name;S.dolls=[newDoll(PRESETS[pendingPreset],n)];S.cur=0;S.intro=true;if(n!==PRESETS[pendingPreset].name)S.stats.renames++;closeModal();save();refreshAll();checkAch();setTimeout(()=>toast('Tip: tap 🏆 Contests to earn coins!',3500),900);},
 rename:()=>nameModal('Rename doll',cur().name,'doRename'),
 doRename:()=>{const n=($('#nm').value||'').trim();if(!n)return;cur().name=n;S.stats.renames++;closeModal();hdr();save();checkAch();if(ui.scr==='dolls')renderDolls();},
 delDoll:()=>modal(`<h3>Delete ${esc(cur().name)}?</h3><p class="hint">This can't be undone. Items you own stay in your closet.</p><div class="row2"><button class="btn danger" data-a="doDel">Delete</button><button class="btn alt" data-a="close">Keep</button></div>`),
 doDel:()=>{if(S.dolls.length<2)return;S.dolls.splice(S.cur,1);S.cur=0;closeModal();save();hdr();renderDolls();},
 wearLook:b=>{const l=S.looks[+b.i];if(!l)return;pushUndo();const d=cur();d.slots=clone(l.slots);d.skin=l.skin;d.build=l.build;thumbCache.clear();save();go('style');toast('Look applied ✨');},
 delLook:b=>{S.looks.splice(+b.i,1);save();renderDolls();},
 settings,help:helpModal,
 tSound:()=>{S.sound=!S.sound;save();settings();},
 tZoom:()=>{S.zoom=!S.zoom;save();settings();renderStage();},
 backup:()=>{const code=enc(JSON.stringify(S));modal(`<h3>📤 Backup code</h3><p class="hint">Copy this code and keep it somewhere safe (notes app, message to yourself). Paste it into Restore to get your progress back on any device.</p><textarea class="tx" id="bk" readonly>${code}</textarea><div class="row2"><button class="btn" data-a="copyBk">Copy</button><button class="btn alt" data-a="close">Close</button></div>`);},
 copyBk:async()=>{const t=$('#bk');try{await navigator.clipboard.writeText(t.value);toast('Copied!');}catch(e){t.select();toast('Select all and copy the code');}},
 restore:()=>modal(`<h3>📥 Restore</h3><p class="hint">Paste a backup code. This replaces your current progress.</p><textarea class="tx" id="bk" placeholder="Paste code here"></textarea><div class="row2"><button class="btn" data-a="doRestore">Restore</button><button class="btn alt" data-a="close">Cancel</button></div>`),
 doRestore:()=>{try{const o=JSON.parse(dec($('#bk').value));if(!adopt(o))throw 0;S.intro=true;closeModal();save();refreshAll();toast('✅ Progress restored');}catch(e){toast('That code didn’t work. Check you copied all of it.');}},
 reset:()=>modal(`<h3>Reset everything?</h3><p class="hint">All dolls, items, coins and trophies will be erased.</p><div class="row2"><button class="btn danger" data-a="doReset">Yes, reset</button><button class="btn alt" data-a="close">Cancel</button></div>`),
 doReset:()=>{S=defState();ui.contest=null;ui.undo=[];thumbCache.clear();closeModal();save();refreshAll();welcome();},
 nav:b=>go(b.s)
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;if(el.id==='modal'&&e.target!==el)return;const f=A[el.dataset.a];if(f)f(el.dataset,el,e);});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='nm'){const b=document.querySelector('.mbox .btn[data-a]');if(b)b.click();}});
function refreshAll(){thumbCache.clear();hdr();go(ui.scr);}

/* ---------- boot ---------- */
load();trackTime();refreshAll();checkAch();if(!S.intro)welcome();
setTimeout(cloudInit,0);

</script>
</body>
</html>
